<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset your password | Unmix</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0e0d15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-auth-page="forgot">
<main class="auth-form-side" style="min-height:100dvh">
  <a class="brand" id="authBrand" href="index.html" aria-label="Unmix home"></a>
  <div class="auth-form-wrap">
    <div id="formView" class="form-stack" style="gap:20px">
      <div style="display:grid;gap:8px">
        <h1>Reset your password</h1>
        <p class="muted">Enter your email and we'll send you a link.</p>
      </div>
      <form id="authForm" class="form-stack" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="emailErr">
          <span class="err" id="emailErr" hidden></span>
        </div>
        <p class="notice bad" id="formError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <p class="switch-line"><a class="link" href="login.html">Back to log in</a></p>
    </div>
    <div id="sentView" class="form-stack" hidden aria-live="polite">
      <h1 id="sentTitle"></h1>
      <p class="muted" id="sentBody"></p>
      <p class="fine">Can't see it? Check your spam folder.</p>
      <a class="btn btn-secondary" href="login.html">Back to log in</a>
    </div>
    <div id="offView" class="form-stack" hidden>
      <h1>Accounts are coming soon</h1>
      <a class="btn btn-primary" href="studio.html">Open Studio</a>
    </div>
  </div>
</main>
<script type="module" src="auth-page.js"></script>
</body>
</html>
